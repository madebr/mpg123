name: CMake macOS

on: push

jobs:
  build:
    strategy:
      matrix:
        os: [macos-latest, macos-13]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Setup ninja
        uses: ./.github/actions/setup-ninja
      - name: Configure (CMake)
        run: |
          cmake -S ports/cmake -B build -GNinja
      - name: Build (CMake)
        run: |
          cmake --build build
